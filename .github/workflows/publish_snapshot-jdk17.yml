name: Publish Snapshot on JDK 17

on:
  workflow_dispatch:

env:
  JDK_VERSION: 17
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-snapshot:
    if: github.repository == 'Unity-Technologies/paimon'
    runs-on: ubuntu-latest
    environment: maven-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          server-id: vector-ai-unity-learner-mvn-dev-local
          server-username: JFROG_USER
          server-password: JFROG_TOKEN
      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: snapshot-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            snapshot-maven-
      - name: Authenticate to JFrog
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: https://unity3d.jfrog.io
        with:
          oidc-provider-name: unity-technologies-gha-oidc
          oidc-audience: unity-technologies-gha-oidc
      - name: Check JFrog access
        run: jf rt ping
      - name: Publish snapshot
        env:
          JFROG_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
          JFROG_SNAPSHOT_REPOSITORY: vector-ai-unity-learner-mvn-dev-local::default::https://unity3d.jfrog.io/artifactory/vector-ai-unity-learner-mvn-dev-local
          MAVEN_OPTS: -Xmx4096m
        run: |
          mvn -ntp clean install \
            -Dgpg.skip -Drat.skip -DskipTests \
            -Papache-release,spark4,flink1 \
            -pl org.apache.paimon:paimon-spark-4.0_2.13 -am

          # paimon-spark-common_2.13 is deployed by publish_snapshot.yml.
          spark4_modules=(
            org.apache.paimon:paimon-spark4-common_2.13
            org.apache.paimon:paimon-spark-ut_2.13
            org.apache.paimon:paimon-spark-4.0_2.13
          )
          printf -v spark4_projects '%s,' "${spark4_modules[@]}"
          spark4_projects="${spark4_projects%,}"

          mvn -ntp clean deploy \
            -Dgpg.skip -Drat.skip -DskipTests \
            -Papache-release,spark4,flink1 \
            -pl "$spark4_projects" \
            -DaltSnapshotDeploymentRepository="$JFROG_SNAPSHOT_REPOSITORY"
